<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Card Room Online · Baccarat · Ba Cây · Sâm Lốc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header><div class="logo">♠ CARD <span>ROOM</span> <small>ONLINE</small></div><button id="lang" class="ghost">中文 / VI</button></header>
    <main>
      <section id="home" class="panel">
        <p class="eyebrow" data-i="welcome">CHƠI BÀI CÙNG BẠN BÈ</p>
        <h1 data-i="heading">Chọn trò chơi của bạn</h1>
        <p class="muted" data-i="virtual">Chỉ dùng điểm VND ảo, không có nạp hoặc rút tiền thật.</p>
        <div class="games">
          <button class="game selected" data-game="baccarat"><span>🂡</span><strong>Baccarat</strong><small>庄 · 闲 · 和</small></button>
          <button class="game" data-game="three"><span>🃏</span><strong>Ba Cây</strong><small>3 lá · 500 điểm</small></button>
          <button class="game" data-game="sam"><span>♣</span><strong>Sâm Lốc</strong><small>10 lá · 1.000/lá</small></button>
        </div>
        <div class="fields"><label><span data-i="name">Tên của bạn</span><input id="name" maxlength="22" placeholder="Nhập tên người chơi"></label><label><span data-i="capacity">Số người trong phòng</span><select id="capacity"><option value="2">2 người</option><option value="3">3 người</option><option value="4">4 người</option></select></label></div>
        <button id="create" class="primary" data-i="create">Tạo phòng mới</button>
        <div class="join"><input id="joinCode" maxlength="6" placeholder="Mã phòng 6 ký tự"><button id="join" data-i="join">Vào phòng</button></div>
      </section>
      <section id="room" class="panel hidden">
        <div class="room-head"><div><p class="eyebrow" id="gameName"></p><h2><span data-i="room">Phòng</span> <span id="roomCode"></span></h2></div><button id="leave" class="danger" data-i="leave">Thoát phòng</button></div>
        <div class="room-actions"><button id="copy" class="ghost" data-i="copy">Sao chép link mời</button><span id="round"></span></div>
        <div id="players" class="players"></div>
        <p id="notice" class="notice"></p>
        <div id="table" class="table-area"></div>
        <div id="myhand" class="hand"></div>
        <div id="controls" class="controls"></div>
        <div id="results" class="results"></div>
      </section>
    </main>
    <footer>Card Room · Demo game · VND ảo · Phòng lưu tạm trên máy chủ</footer>
    <div id="toast" role="status"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
